{% extends "base.html" %}
{% block title %}Read the Room!{% endblock %}
{% block content %}
    <h1>Read the Room!</h1>
    <div class="button-stack">
        <a class="btn {{ 'btn-secondary' if game_exists else 'btn-primary' }}" href="{{ url_for('manage_game') }}">Manage Game</a>
        <a class="btn {{ 'btn-primary' if game_exists else 'btn-secondary' }}" href="{{ url_for('join_game') }}">Join Game</a>
    </div>

    <script>
        setTimeout(function () {
            window.location.reload();
        }, 1000);
    </script>
{% endblock %}
