{% extends "base.html" %}
{% block title %}Welcome{% endblock %}
{% block content %}
    <h1>Welcome to Read the Room!</h1>

    {% if error %}
        <ul class="errors">
            <li>{{ error }}</li>
        </ul>
    {% endif %}

    <form method="post" action="{{ url_for('welcome') }}">
        <label for="name" class="label-large">What's YOUR name?</label>
        <input type="text" id="name" name="name" autofocus>

        <label for="language">Language</label>
        <select id="language" name="language">
            {% for code, info in languages.items() %}
                <option value="{{ code }}" {% if code == language %}selected{% endif %}>{{ info.label }}</option>
            {% endfor %}
        </select>

        <div class="button-row">
            <a class="btn btn-secondary" href="{{ url_for('index') }}">Quit</a>
            <button class="btn btn-primary btn-lg" type="submit">Join</button>
        </div>
    </form>
{% endblock %}
