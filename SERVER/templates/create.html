{% extends "base.html" %}
{% block title %}Create Game{% endblock %}
{% block content %}
    <h1>Create Game</h1>

    {% if errors %}
        <ul class="errors">
            {% for error in errors %}
                <li>{{ error }}</li>
            {% endfor %}
        </ul>
    {% endif %}

    <form method="post" action="{{ url_for('create_game') }}">
        <label for="password">Password to join (optional)</label>
        <input type="text" id="password" name="password" value="{{ password or '' }}">

        <label for="num_players">Number of players</label>
        <input type="number" id="num_players" name="num_players" min="1" value="{{ num_players or '' }}">

        <label for="num_questions">Number of Questions</label>
        <input type="number" id="num_questions" name="num_questions" min="1" value="{{ num_questions or '' }}">

        <label for="language">Language</label>
        <select id="language" name="language">
            {% for code, info in languages.items() %}
                <option value="{{ code }}" {% if code == language %}selected{% endif %}>{{ info.label }}</option>
            {% endfor %}
        </select>

        <label for="color_scheme">Color scheme</label>
        <select id="color_scheme" name="color_scheme">
            {% for code, info in color_schemes.items() %}
                <option value="{{ code }}" {% if code == color_scheme %}selected{% endif %}>{{ info.label }}</option>
            {% endfor %}
        </select>

        <div class="button-row">
            <a class="btn btn-secondary" href="{{ url_for('index') }}">Cancel</a>
            <button class="btn btn-primary" type="submit">Create</button>
        </div>
    </form>
{% endblock %}
