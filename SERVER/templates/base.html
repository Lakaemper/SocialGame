<!doctype html>
<html lang="en" data-theme="{{ theme }}">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Read the Room!{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="card">
        {% block content %}{% endblock %}
    </main>

    <script>
        (function () {
            var secretClickCount = 0;
            var lastSecretClickTime = 0;
            var secretRemoveUrl = {{ url_for('secret_remove')|tojson }};

            document.addEventListener("click", function (event) {
                if (event.target.closest("a, button, input, select, textarea, label")) {
                    return;
                }

                var now = Date.now();
                if (now - lastSecretClickTime > 1500) {
                    secretClickCount = 0;
                }
                secretClickCount += 1;
                lastSecretClickTime = now;

                if (secretClickCount >= 5) {
                    window.location.href = secretRemoveUrl;
                }
            });
        })();
    </script>
</body>
</html>
